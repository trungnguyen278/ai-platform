name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocols:
    name: Schemas, examples and compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the tags, for the compatibility check
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Check
        run: python tools/check.py
